<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Room — 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<!-- bump ?v= whenever the room changes, so browsers fetch the new files -->
<link rel="stylesheet" href="styles.css?v=9">
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.166.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.166.0/examples/jsm/",
    "gsap": "https://cdn.jsdelivr.net/npm/gsap@3.12.5/+esm"
  }
}
</script>
</head>
<body>

<canvas id="scene"></canvas>

<div id="loader" class="loader"><span>Building the room…</span></div>

<header class="topbar">
  <h1>My Room</h1>
  <div class="modes" role="group" aria-label="Mode">
    <button id="mode-look" class="btn is-active" type="button">Look</button>
    <button id="mode-move" class="btn" type="button">Move things</button>
  </div>
</header>

<div class="hint" id="hint">Drag to spin · pinch or scroll to zoom · tap an item</div>

<section class="card" id="card" hidden>
  <button class="card-close" id="card-close" type="button" aria-label="Close">×</button>
  <h2 id="card-title">Item</h2>
  <p id="card-desc">Description</p>
  <p class="card-coords" id="card-coords" hidden></p>
  <div class="card-actions" id="card-actions">
    <button class="btn" id="act-rotate" type="button">Rotate 15°</button>
    <button class="btn" id="act-back" type="button">Back to room</button>
  </div>
</section>

<footer class="bottombar">
  <button class="btn" id="view-plan" type="button">Plan</button>
  <button class="btn" id="reset-view" type="button">Doorway</button>
  <button class="btn" id="toggle-axes" type="button">Axes</button>
  <button class="btn" id="toggle-light" type="button">Night</button>
  <button class="btn btn-quiet" id="reset-room" type="button">Reset</button>
</footer>

<script type="module" src="main.js?v=9"></script>
</body>
</html>
